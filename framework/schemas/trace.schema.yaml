$schema: "http://json-schema.org/draft-07/schema#"
title: TraceEvent
type: object
required: [run_id, source_role, event_type, timestamp, payload]
properties:
  run_id:
    type: string
  source_role:
    type: string
  event_type:
    type: string
  timestamp:
    type: number
  message:
    type: string
  payload:
    type: object
