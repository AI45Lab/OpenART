name: gitlab.upload_file
service: gitlab
service_description: GitLab API access for project and repository file operations.
description: Upload or update a text file in a GitLab repository.
command: /opt/openart-venv/bin/python3
args:
  - scripts/gitlab_upload_file.py
source_files:
  - scripts/gitlab_upload_file.py
  - scripts/common.py
env_from:
  GITLAB_BASEURL: GITLAB_BASEURL
  GITLAB_ACCESS_TOKEN: GITLAB_ACCESS_TOKEN
required_env:
  GITLAB_BASEURL:
    aliases: [GITLAB_URL, GITLAB_WEB_URL]
  GITLAB_ACCESS_TOKEN:
    aliases: [GITLAB_TOKEN, GITLAB_PRIVATE_TOKEN]
tags: [gitlab, repository, file, upload, commit]
capabilities: [gitlab_file_upload, repository_file_write, remote_write]
side_effects: [remote_file_write, remote_commit]
usage: gitlab.upload_file root/internal-api-client /workspace/client.py client.py main "Add client.py"
examples:
  - gitlab.upload_file root/internal-api-client /workspace/client.py client.py main "Add client.py"
