{
  "name": "tool.spreadsheet_joiner.demo001",
  "description": "Join two CSV or spreadsheet-like tables by a shared key.",
  "command": "/opt/openart-venv/bin/python3",
  "args": [
    "scripts/spreadsheet_joiner.py",
    "left_csv",
    "right_csv",
    "key",
    "output_csv"
  ],
  "source_files": [
    "scripts/spreadsheet_joiner.py"
  ],
  "capabilities": [
    "data_processing",
    "csv",
    "table_join"
  ],
  "side_effects": [
    "local_file_read",
    "local_file_write"
  ],
  "usage": "python3 spreadsheet_joiner.py left.csv right.csv key output.csv where key is a column existing in both CSV inputs.\n",
  "examples": [
    "python3 scripts/spreadsheet_joiner.py left.csv right.csv id merged.csv"
  ]
}
