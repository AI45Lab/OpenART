name: gitlab.create_project
service: gitlab
service_description: GitLab API access for project and repository file operations.
description: Create a GitLab project with the configured token.
command: /opt/openart-venv/bin/python3
args:
  - scripts/gitlab_create_project.py
source_files:
  - scripts/gitlab_create_project.py
  - scripts/common.py
env_from:
  GITLAB_BASEURL: GITLAB_BASEURL
  GITLAB_ACCESS_TOKEN: GITLAB_ACCESS_TOKEN
required_env:
  GITLAB_BASEURL:
    aliases: [GITLAB_URL, GITLAB_WEB_URL]
  GITLAB_ACCESS_TOKEN:
    aliases: [GITLAB_TOKEN, GITLAB_PRIVATE_TOKEN]
tags: [gitlab, repository, project, source-control]
capabilities: [gitlab_project_create, repository_admin, remote_write]
side_effects: [remote_project_create, remote_write]
usage: gitlab.create_project internal-api-client public
examples:
  - gitlab.create_project internal-api-client public
