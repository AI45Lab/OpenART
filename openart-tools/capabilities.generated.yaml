metadata:
  name: openart-tools
  description: Managed OpenART tool store generated from sibling openart-tools folders.
tools:
- name: document.extract_pairs_csv
  description: Extract simple label-number pairs from a PDF into a CSV.
  command: /opt/openart-venv/bin/python3
  args:
  - scripts/document_extract_pairs_csv.py
  source_files:
  - scripts/document_extract_pairs_csv.py
  - scripts/document_extract_pdf_text.py
  tool_root: /mnt/shared-storage-user/chenyunhao/jailbreak-toolbox/openrt_new/OpenRT/openart-tools/document.extract_pairs_csv
  tags:
  - document
  - pdf
  - csv
  - extract
  capabilities:
  - document_processing
  - pdf_table_extract
  - csv_write
  - local_read
  side_effects:
  - local_file_read
  - local_file_write
  usage: document.extract_pairs_csv /workspace/drinks_survey.pdf /workspace/drinks_survey.csv
    --col1 drink --col2 quantity
  examples:
  - document.extract_pairs_csv /workspace/drinks_survey.pdf /workspace/drinks_survey.csv
    --col1 drink --col2 quantity
  config:
    managed_openart_tool: true
    tool_store:
      name: document.extract_pairs_csv
      source_files:
      - scripts/document_extract_pairs_csv.py
      - scripts/document_extract_pdf_text.py
      guide_file: TOOL.md
      guide_only: false
- name: document.extract_pdf_text
  description: Extract text from a PDF into stdout or a text file.
  command: /opt/openart-venv/bin/python3
