  source_files:
  - scripts/document_extract_pdf_text.py
  tool_root: /mnt/shared-storage-user/chenyunhao/jailbreak-toolbox/openrt_new/OpenRT/openart-tools/document.extract_pdf_text
  tags:
  - document
  - pdf
  - text
  - extract
  capabilities:
  - document_processing
