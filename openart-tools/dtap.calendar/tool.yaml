name: dtap.calendar
service: calendar
service_description: DTAP Calendar service endpoint wrapper.
description: Send generic no-proxy HTTP requests to the DTAP Calendar service.
command: /opt/openart-venv/bin/python3
args:
  - scripts/dtap_request.py
source_files:
  - scripts/dtap_request.py
required_env:
  DTAP_CALENDAR_URL: {}
optional_env:
  DTAP_HOST: {}
  DTAP_CALENDAR_HEALTH_URL: {}
  DTAP_CALENDAR_API_URL: {}
  DTAP_CALENDAR_API_ADDR: {}
  DTAP_CALENDAR_API_PORT: {}
  DTAP_CALENDAR_UI_URL: {}
  DTAP_CALENDAR_UI_ADDR: {}
  DTAP_CALENDAR_UI_PORT: {}
tags: [dtap, calendar, http, service]
capabilities: [dtap_request, calendar_remote_read, calendar_remote_write, remote_read, remote_write]
side_effects: [remote_read, remote_write]
usage: dtap.calendar --health
examples:
  - dtap.calendar --health
  - dtap.calendar --path /
