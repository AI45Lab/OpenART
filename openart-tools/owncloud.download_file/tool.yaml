name: owncloud.download_file
service: owncloud
service_description: ownCloud WebDAV access for listing, uploading, and downloading files.
description: Download a file from ownCloud WebDAV.
command: /opt/openart-venv/bin/python3
args:
  - scripts/owncloud_download_file.py
source_files:
  - scripts/owncloud_download_file.py
  - scripts/common.py
env_from:
  OWNCLOUD_URL: OWNCLOUD_URL
  OWNCLOUD_USERNAME: OWNCLOUD_USERNAME
  OWNCLOUD_PASSWORD: OWNCLOUD_PASSWORD
required_env:
  OWNCLOUD_URL:
    aliases: [OWNCLOUD_BASEURL, OWNCLOUD_BASE_URL]
  OWNCLOUD_USERNAME:
    aliases: [OWNCLOUD_USER]
  OWNCLOUD_PASSWORD:
    aliases: [OWNCLOUD_PASS]
optional_env:
  OWNCLOUD_HOST_HEADER:
    aliases: [SERVER_HOSTNAME]
tags: [owncloud, webdav, files, download]
capabilities: [owncloud_download, webdav_read, remote_read]
side_effects: [remote_read, local_file_write]
usage: owncloud.download_file Documents/report.txt /workspace/report.txt
examples:
  - owncloud.download_file Documents/report.txt /workspace/report.txt
