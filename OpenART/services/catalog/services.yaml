          DATABRICKS_PG_PASSWORD: dbx
          DATABRICKS_API_HOST: '{{ bind_host }}'
          DATABRICKS_API_PORT: '{{ api_port }}'
          DATABRICKS_DATA_DIR: /app/data
          DATABRICKS_WAREHOUSE_DIR: /app/warehouse
          SEARCH_MODE: faiss
          SEARCH_TABLE: product_search_view
          SEARCH_COLUMNS: name,description
          OAUTH_ISSUER: databricks
          OAUTH_DEFAULT_AUDIENCE: databricks-api
          OAUTH_ACCESS_TOKEN_TTL: '31536000'
        admin: true
        depends_on:
          dtap-databricks-pg:
            condition: service_healthy
        volumes:
        - dtap-databricks-data:/app/data
        healthcheck:
          test:
          - CMD-SHELL
          - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:25801/health',
            timeout=3)"
          interval: 10s
          timeout: 5s
          retries: 12
          start_period: 30s
    roles:
      api: dtap-databricks-admin
      pg: dtap-databricks-pg
    ports:
      api: '25801'
      pg: '25800'
    host_ports:
      pg: '25800'
    task_env:
      DTAP_DATABRICKS_URL: '{{ url:dtap-databricks-admin:25801 }}'
      DTAP_DATABRICKS_HEALTH_URL: '{{ url:dtap-databricks-admin:25801 }}/health'
      DTAP_DATABRICKS_PG_ADDR: '{{ pg_addr }}'
      DTAP_DATABRICKS_ADMIN_URL: '{{ url:dtap-databricks-admin:25801 }}'
    requires: []
    assets:
    - databricks/init
  bigquery:
    compose:
      dtap-bigquery:
        image: ghcr.io/goccy/bigquery-emulator:latest
        command:
        - --project=openart
        - --port={{ api_port }}
        - --grpc-port=25901
        - --database=/var/lib/bigquery/emulator.db
        volumes:
        - dtap-bigquery-data:/var/lib/bigquery
    roles:
      api: dtap-bigquery
    ports:
      api: '25900'
    host_ports: {}
    task_env:
      DTAP_BIGQUERY_URL: '{{ url:dtap-bigquery:25900 }}'
      DTAP_BIGQUERY_API_URL: '{{ url:dtap-bigquery:25900 }}'
      DTAP_BIGQUERY_API_ADDR: '{{ host:dtap-bigquery }}:25900'
      DTAP_BIGQUERY_GRPC_ADDR: '{{ host:dtap-bigquery }}:25901'
    requires: []
    assets:
    - bigquery/init
