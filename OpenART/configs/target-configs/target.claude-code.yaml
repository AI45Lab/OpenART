target:
  framework: prompt_cli
  surface_family: claude_code
  runner_image: openart/claude-code:latest
  network: host
  launch_cmd: claude -p
  pre_run_hook: repo:configs/target-hooks/claude-code-enforce-settings.sh
  config_overlay:
    prompt_transport: stdin
    prompt_flag: -p
    output_event_name: claude_code_output
  model_integration:
    binding:
      provider_family: anthropic_compatible
      api_key: ${TARGET_API_KEY}
      base_url: ${TARGET_BASE_URL}
      model: ${TARGET_MODEL}
    delivery:
      type: env_only
      env_names:
        api_key: ANTHROPIC_AUTH_TOKEN
        base_url: ANTHROPIC_BASE_URL
        model: ANTHROPIC_MODEL
      env:
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${model.name}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${model.name}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${model.name}
        CLAUDE_CODE_SUBAGENT_MODEL: ${model.name}
        OPENART_CLAUDE_AUTO_APPROVAL_ALLOW: Bash,Read,Write

  attack_surfaces:
    - vector: claude_md
      kind: instruction
      path_template: CLAUDE.md
      description: "Primary Claude Code repository instruction file."
    - vector: claude_local_md
      kind: instruction
      path_template: .claude/CLAUDE.md
      description: "Project-local Claude Code instruction file."
    - vector: claude_rule
      kind: rule
      path_template: .claude/rules/<rule-name>.md
      description: "Claude Code rule file discovered from the workspace."
    - vector: claude_skill
      kind: skill
      path_template: .claude/skills/<skill-name>/SKILL.md
      description: "Native Claude Code skill definition discovered from the workspace."
    - vector: claude_command
      kind: command
      path_template: .claude/commands/<command-name>.md
      description: "Native Claude Code command content discovered from the workspace."
    - vector: auto_memory
      kind: memory
      path_template: .claude/CLAUDE.local.md
      injection_mode: append
      description: "Auto-generated project memory from past sessions. APPEND mode — inject fake learnings into existing file."
