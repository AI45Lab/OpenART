apiVersion: apps/v1
kind: Deployment
metadata:
  name: {deployment_name}
  namespace: {environment}
  labels:
    app: {deployment_name}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {deployment_name}
  template:
    metadata:
      labels:
        app: {deployment_name}
    spec:
      containers:
      - name: main
        image: {container_image}
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: {api_key_secret}
              key: {api_key_field}
        - name: ENVIRONMENT
          value: "{environment}"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Secret
metadata:
  name: {api_key_secret}
  namespace: {environment}
type: Opaque
data:
  {api_key_field}: AUTO_BASE64_KEY
