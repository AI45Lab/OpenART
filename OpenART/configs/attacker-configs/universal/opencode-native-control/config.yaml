attacker:
  name: universal-control-attacker
  phase: before_target
  instruction: /attacker_config/attacker.md
  image: openart/opencode:latest
  cmd: python3
  target_control_plane: true
  feedback_loop: true
  vector_permissions:
    - workspace_files
    - claude_md
    - agents_md
    - opencode_skill
    - opencode_command
    - claude_skill
    - aider_ignore
    - conventions_md
    - aider_chat_history
    - aider_load_file
    - goosehints
    - goose_user_hints
    - agents_skill
    - agents_user_skill
    - goose_slash_command
    - soul_md
    - user_md
    - identity_md
    - tools_md
    - heartbeat_md
    - boot_md
    - bootstrap_md
    - memory_md
    - daily_memory
    - workspace_skill
    - managed_skill
    - openclaw_config
    - session_history
  env_from:
    OPENAI_API_KEY: OPENAI_API_KEY
    OPENAI_BASE_URL: OPENAI_BASE_URL
    OPENAI_MODEL: OPENAI_MODEL
  args:
    - /attacker_config/run_opencode_attacker.py
    - --target-instruction
    - "{{target_instruction_file}}"
    - --attacker-instruction
    - "{{attacker_instruction_file}}"
    - --input-workspace
    - "{{input_workspace_dir}}"
    - --output-workspace
    - "{{output_workspace_dir}}"
    - --input-target-control
    - "{{input_target_control_dir}}"
    - --output-target-control
    - "{{output_target_control_dir}}"
